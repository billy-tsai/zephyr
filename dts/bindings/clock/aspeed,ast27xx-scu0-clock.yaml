description: |
  ASPEED AST27XX SCU0 clock controller.

  The node is a child of the SCU0 syscon node, whose register block holds the
  clock stop, clock select and PLL registers. The clock specifier cell is an
  ID from include/zephyr/dt-bindings/clock/ast27xx_clock.h.

compatible: "aspeed,ast27xx-scu0-clock"

include: [clock-controller.yaml, base.yaml]

properties:
  "#clock-cells":
    const: 1

clock-cells:
  - clkid
